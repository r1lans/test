<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c8371e">
<meta name="description" content="Global Education Karshi — jurnal, o‘quvchilar, to‘lovlar va mock natijalari">
<title>Global Education Karshi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE work: the daily tool of an offline learning centre, calm and exact
   IDEA the paper class register (sinf jurnali), made live: names down, lesson days across, ticks in cells
   PICTURE the journal itself; for the director, the month's money bar and income chart
   COLOUR stone ground, black ink, brick red for what needs action, white panels; night: warm black
   TYPE Schibsted Grotesk for everything, one family, five sizes (13/15/16/20/34)
   LAYOUT laptop: left rail + working area; phone: top bar, content, bottom tabs like a native app */
:root{color-scheme:light dark;--bg:light-dark(#e7e4df,#151311);--panel:light-dark(#ffffff,#211e1b);--panel2:light-dark(#f3f1ed,#2a2622);--ink:light-dark(#141210,#f1ede7);--soft:light-dark(#5d5750,#b3aca3);--line:light-dark(#d8d3cb,#38332d);--brick:#c8371e;--brick-ink:light-dark(#b02f18,#ff8a70);--brick-bg:light-dark(#f8e3dd,#3d211a);--ok:light-dark(#1f6b3a,#86d9a1);--ok-bg:light-dark(#e1efe4,#1c3224);--warn:light-dark(#8a5a00,#f2c46b);--warn-bg:light-dark(#f7ecd3,#3a2f16);--blue:light-dark(#1f4f8b,#8fb8ec);--blue-bg:light-dark(#e2ebf6,#1c2a3c)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;line-height:1.3}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brick);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:light-dark(#141210,#0d0b0a);color:#f1ede7;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brick);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:16px;line-height:1.15}
.brand small{opacity:.65;font-size:13px}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;font-size:15px;min-height:44px}
.nav a:hover{background:rgb(241 237 231/.1)}
.nav a.on{background:#f1ede7;color:#141210}
.nav svg{width:20px;height:20px;flex:none}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 4px;border-top:1px solid rgb(241 237 231/.15)}
.me b{display:block;font-size:15px}
.me small{opacity:.65;font-size:13px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.side .ibtn{background:rgb(241 237 231/.08);border-color:rgb(241 237 231/.25);color:#f1ede7}
.ibtn svg{width:20px;height:20px}
.main{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;gap:12px;align-items:center;padding:14px clamp(16px,3vw,32px);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0;flex:1}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-height:44px}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--soft)}
.sres{position:absolute;top:50px;right:0;left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0/.15);overflow:hidden;z-index:20}
.sres button{display:flex;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;align-items:center}
.sres button:hover{background:var(--panel2)}
.mlogo,.mset{display:none}
#view{padding:clamp(16px,3vw,32px);display:grid;gap:20px;align-content:start;max-width:1320px;width:100%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em;line-height:1.2}
.panel h2 small{font-weight:400;color:var(--soft);font-size:15px;margin-left:6px}
.lead{font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--soft);margin:6px 0 0;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.kpi span{color:var(--soft);font-size:15px}
.kpi.alert b{color:var(--brick-ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fig{position:relative;min-height:260px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:13px;fill:var(--soft);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.money{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden;display:flex}
.money i{display:block;height:100%}
.list{display:grid}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1}
.row small,.muted{display:block;color:var(--soft);font-size:13px}
.time{font-weight:800;font-size:20px;width:64px;flex:none;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-bad{background:var(--brick-bg);color:var(--brick-ink)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-n{background:var(--panel2);color:var(--soft)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;min-height:44px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.p{background:var(--brick);border-color:var(--brick);color:#fff}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips>*{flex:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:8px 14px;white-space:nowrap;min-height:40px;font-weight:500;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 14px;min-height:42px;font-weight:600;font-size:15px;border-left:1px solid var(--line);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--soft);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* journal */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.steps button{border:0;border-left:1px solid var(--line);background:none;padding:10px 12px;min-height:56px;text-align:left;font-weight:600;font-size:15px}
.steps button:first-child{border-left:0}
.steps button small{display:block;font-weight:400;color:var(--soft);font-size:13px}
.steps button.on{background:var(--ink);color:var(--bg)}
.steps button.on small{color:inherit;opacity:.75}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.mark{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.who{display:flex;gap:12px;align-items:center}
.who b{display:block;font-size:16px;line-height:1.25}
.pick{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pick button{border:0;border-left:1px solid var(--line);background:var(--panel);padding:0 14px;min-height:44px;font-weight:600;font-size:15px;white-space:nowrap}
.pick button:first-child{border-left:0}
.pick button.on.p,.pick button.on.y{background:var(--ok-bg);color:var(--ok)}
.pick button.on.l{background:var(--warn-bg);color:var(--warn)}
.pick button.on.a,.pick button.on.n{background:var(--brick);color:#fff}
.mark.off{opacity:.5}
.reg{border-collapse:separate;border-spacing:0;font-size:15px}
.reg th,.reg td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;height:40px;min-width:40px}
.reg th{font-size:13px;line-height:1.1;padding:4px 2px}
.reg th.today{background:var(--brick);color:#fff}
.reg td.nm,.reg th.nm{position:sticky;left:0;background:var(--panel);text-align:left;padding:0 12px;min-width:180px;z-index:1;font-weight:500;white-space:nowrap}
.reg td.pc{font-weight:700;padding:0 10px;font-variant-numeric:tabular-nums}
.c-ok{color:var(--ok);font-weight:800}
.c-bad{background:var(--brick-bg);color:var(--brick-ink);font-weight:800}
.c-warn{background:var(--warn-bg);color:var(--warn);font-weight:800}
.c-off{color:var(--soft)}
/* mocks */
.mocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;text-align:left;display:grid;gap:6px}
.mcard.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mcard b.big{font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em}
.band{display:inline-grid;place-items:center;min-width:44px;height:32px;border-radius:9px;font-weight:800;background:var(--panel2);font-variant-numeric:tabular-nums}
.band.hi{background:var(--ok-bg);color:var(--ok)}
.band.lo{background:var(--brick-bg);color:var(--brick-ink)}
.up{color:var(--ok);font-weight:700;font-size:13px}
.down{color:var(--brick-ink);font-weight:700;font-size:13px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.col{background:var(--panel2);border-radius:14px;padding:10px;scroll-snap-align:start;display:grid;gap:8px;align-content:start}
.col h3{margin:4px 6px 6px;font-size:15px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.card b{font-size:15px}
.card .btn{min-width:max-content}
/* schedule */
.slot{display:grid;grid-template-columns:72px minmax(0,1fr);border-top:1px solid var(--line);padding:10px 0}
.slot:first-child{border-top:0}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.les{border-radius:12px;padding:10px 12px;background:var(--panel2);border-left:4px solid var(--brick)}
.les b{display:block}
/* parent phone */
.phone{width:min(400px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:34px;padding:18px 16px 22px;box-shadow:0 24px 50px rgb(0 0 0/.12);display:grid;gap:14px}
.hero{background:light-dark(#141210,#f1ede7);color:light-dark(#f1ede7,#141210);border-radius:20px;padding:16px;display:grid;gap:4px}
.hero b{font-size:20px;line-height:1.15}
.hero small{opacity:.7;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:13px}
.cal span{height:34px;display:grid;place-items:center;border-radius:9px;background:var(--panel2);color:var(--soft)}
.cal .p{background:var(--ok-bg);color:var(--ok);font-weight:700}
.cal .a{background:var(--brick);color:#fff;font-weight:700}
.cal .l{background:var(--warn-bg);color:var(--warn);font-weight:700}
.cal .h{background:none}
.msg{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:15px}
.msg small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.ring{--v:80;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring b{width:64px;height:64px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:16px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lbox{width:min(560px,100%);display:grid;gap:18px}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rolec{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;text-align:left;display:grid;gap:6px;min-height:120px}
.rolec:hover{border-color:var(--ink)}
.rolec svg{width:26px;height:26px;color:var(--brick)}
.rolec b{font-size:16px}
.rolec span{color:var(--soft);font-size:13px;line-height:1.35}
/* drawer, modal, toast */
.shade{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:40;display:none}
.shade.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);z-index:41;transform:translateX(105%);transition:transform .25s ease;overflow:auto;padding:20px;display:grid;gap:16px;align-content:start}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border-radius:18px;z-index:42;padding:20px;display:none;gap:14px}
.modal.on{display:grid}
.modal h3,.drawer h3{margin:0;font-size:20px;line-height:1.2}
.f{display:grid;gap:6px}
.f label{font-size:13px;color:var(--soft)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);min-height:44px;width:100%}
.f textarea{min-height:150px;font-size:15px;font-variant-numeric:tabular-nums}
.x{border:0;background:var(--panel2);width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(220%);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:60;transition:transform .25s ease,opacity .25s;max-width:calc(100% - 24px);font-weight:500}
.toast.on{transform:translateX(-50%);opacity:1}
.demo{font-size:13px;color:var(--soft);margin:0}
.tabs{display:none}
.empty{color:var(--soft);padding:16px 0;margin:0}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
.app{grid-template-columns:minmax(0,1fr)}
.side{display:none}
.mlogo,.mset{display:grid}
.top{flex-wrap:wrap;padding:12px 16px}
.top h1{font-size:22px;flex-basis:100%;order:3}
.search{width:auto;flex:1;order:2}
.mset{order:2}
.main{padding-bottom:84px}
.lead{font-size:26px}
.kpi b{font-size:28px}
.tabs{display:grid;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a,.tabs button{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--soft);text-decoration:none;border:0;background:none;padding:6px 0;min-height:52px}
.tabs a.on{color:var(--brick-ink);font-weight:700}
.tabs svg{width:22px;height:22px}
.mark{grid-template-columns:minmax(0,1fr)}
.pick{display:flex}
.pick button{flex:1}
.kan{grid-template-columns:repeat(5,minmax(78vw,1fr))}
.bar>.chips{flex:1 1 100%!important}
.mocks{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;scroll-snap-type:x mandatory}
.mcard{scroll-snap-align:start}
.mhead{flex-direction:column;align-items:stretch}
.toast{bottom:86px}
.steps button{padding:8px;min-height:52px}
}
@media (max-width:600px){
table.stack thead{display:none}
table.stack tr{display:grid;padding:10px 0;border-bottom:1px solid var(--line)}
table.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 2px}
table.stack td::before{content:attr(data-l);color:var(--soft);font-size:13px}
.panel{padding:16px}
.slot{grid-template-columns:58px minmax(0,1fr)}
.roles{grid-template-columns:minmax(0,1fr)}
.steps button small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

const LS = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let L = LS.get('gek-lang', 'uz'); if (!W[L]) L = 'uz';
let THEME = LS.get('gek-theme', 'auto');
const t = (k, o) => { let s = W[L][k] ?? W.uz[k] ?? k; if (o) for (const x in o) s = s.split('{' + x + '}').join(o[x]); return s; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ |,/g, ' ');
const mln = (n) => (Math.round(n / 1e5) / 10).toLocaleString(L === 'en' ? 'en-US' : 'ru-RU') + ' ' + t('mln');
const $ = (s) => document.querySelector(s);
function applyTheme() { const r = document.documentElement; if (THEME === 'auto') delete r.dataset.theme; else r.dataset.theme = THEME; }
applyTheme();

/* ================= sample data ================= */
let seed = 7;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
const TODAY_ISO = iso(TODAY);
const mkey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const MONTH = mkey(TODAY);
const monthName = (k) => t('months')[+k.slice(5) - 1];
const dayName = (ds) => { const d = new Date(ds + 'T12:00'); return d.getDate() + ' ' + monthName(ds.slice(0, 7)).toLowerCase(); };
const wd = (d) => (d.getDay() + 6) % 7;
const ago = (n) => { const d = new Date(TODAY); d.setDate(d.getDate() - n); return d; };
const phoneN = () => '+998 9' + pick(['0', '1', '3', '4', '7', '9']) + ' ' + (100 + Math.floor(rnd() * 900)) + ' ' + pad(Math.floor(rnd() * 100)) + ' ' + pad(Math.floor(rnd() * 100));
const half = (x) => Math.max(3, Math.min(9, Math.round(x * 2) / 2));
const overall = (a) => { const m = a.reduce((x, y) => x + y, 0) / a.length, f = Math.floor(m), r = m - f; return r < .25 ? f : r < .75 ? f + .5 : f + 1; };
const cefr = (s) => s >= 65 ? 'C1' : s >= 51 ? 'B2' : s >= 38 ? 'B1' : 'A2';

function build() {
  seed = 7;
  const first = ['Azizbek','Madina','Jasur','Dilnoza','Shahzod','Sevara','Bekzod','Malika','Sardor','Nilufar','Javohir','Zarina','Otabek','Gulnoza','Diyorbek','Shahnoza','Abdulloh','Mohinur','Islom','Muslima','Asadbek','Kamola','Behruz','Laylo','Sanjar','Mubina','Temur','Rayhona','Ulug‘bek','Charos','Firdavs','Oydin','Doniyor','Sabina','Ibrohim','Ziyoda'];
  const FEM = new Set(['Madina','Dilnoza','Sevara','Malika','Nilufar','Zarina','Gulnoza','Shahnoza','Mohinur','Muslima','Kamola','Laylo','Mubina','Rayhona','Charos','Oydin','Sabina','Ziyoda']);
  const last = ['Karimov','Rahimov','Tursunov','Xolmatov','Ergashev','Normatov','Qodirov','Abdullayev','Sultonov','Yusupov','Mamatqulov','Hamroyev','Jo‘rayev','Ismoilov','Boboyev','Nazarov','Shukurov','Raxmatov'];
  const person = () => { const f = pick(first); return f + ' ' + pick(last) + (FEM.has(f) ? 'a' : ''); };
  const teachers = [
    { id: 't1', name: 'Dilshod Tursunov', subject: 'IELTS', share: .45 }, { id: 't2', name: 'Sabina Karimova', subject: 'General English', share: .4 },
    { id: 't3', name: 'Shoxrux Nazarov', subject: 'Matematika', share: .4 }, { id: 't4', name: 'Nodira Ergasheva', subject: 'Kids English', share: .4 },
    { id: 't5', name: 'Akmal Rahimov', subject: 'Rus tili', share: .4 }, { id: 't6', name: 'Gulshan Yusupova', subject: 'SAT / DTM', share: .45 }];
  const courses = [
    { id: 'ielts', name: 'IELTS', price: 650000 }, { id: 'ge', name: 'General English', price: 450000 }, { id: 'kids', name: 'Kids English', price: 380000 },
    { id: 'math', name: 'Matematika (DTM)', price: 420000 }, { id: 'rus', name: 'Rus tili', price: 350000 }, { id: 'sat', name: 'SAT Math', price: 600000 }];
  const GG = [
    ['IELTS 6.5+', 'ielts', 't1', '201', 'odd', '16:00', 9, 6.2], ['IELTS Foundation', 'ielts', 't1', '201', 'even', '14:00', 11, 5],
    ['GE Elementary', 'ge', 't2', '102', 'odd', '14:00', 12, 0], ['GE Pre-Intermediate', 'ge', 't2', '102', 'even', '16:00', 10, 0],
    ['Kids Starters', 'kids', 't4', '101', 'odd', '10:00', 12, 0], ['Kids Movers', 'kids', 't4', '101', 'even', '10:00', 10, 0],
    ['Matematika DTM-1', 'math', 't3', '103', 'odd', '08:30', 13, 0], ['Matematika DTM-2', 'math', 't3', '103', 'even', '18:00', 11, 0],
    ['Rus tili A2', 'rus', 't5', '202', 'odd', '18:00', 9, 0], ['SAT Math', 'sat', 't6', '202', 'even', '12:00', 8, 0]];
  const students = [], groups = [];
  let sn = 0;
  GG.forEach((g, i) => {
    const grp = { id: 'g' + (i + 1), name: g[0], course: g[1], teacher: g[2], room: g[3], days: g[4], time: g[5], ids: [], base: g[7] };
    for (let k = 0; k < g[6]; k++) {
      const id = 's' + (++sn);
      students.push({ id, name: person(), phone: phoneN(), parent: pick(['mother', 'father']), pphone: phoneN(), groups: [grp.id], joined: iso(ago(Math.floor(rnd() * 330) + (k < 2 ? 0 : 20))),
        skip: rnd() < .12 ? .33 : .06, lazy: rnd() < .2 ? .45 : .1, payer: rnd(), lvl: g[7] ? g[7] + (rnd() - .5) * 1.4 : 0, cefrB: 34 + rnd() * 30 });
      grp.ids.push(id);
    }
    groups.push(grp);
  });
  for (let k = 0; k < 8; k++) { const s = students[Math.floor(rnd() * students.length)], g = pick(groups); if (!s.groups.includes(g.id)) { s.groups.push(g.id); g.ids.push(s.id); } }
  const att = {}, hw = {};
  for (let back = 40; back >= 1; back--) {
    const d = ago(back); if (wd(d) === 6) continue;
    groups.forEach((g) => {
      if (!lessonDay(g, d)) return;
      const key = g.id + '|' + iso(d), a = {}, h = {};
      g.ids.forEach((sid) => {
        const s = students.find((x) => x.id === sid); if (s.joined > iso(d)) return;
        const r = rnd(); a[sid] = r < s.skip ? 'a' : r < s.skip + .06 ? 'l' : 'p';
        if (a[sid] !== 'a') h[sid] = rnd() < s.lazy ? 'n' : 'y';
      });
      att[key] = a; hw[key] = h;

  }
  const payments = []; let pn = 0;
  for (let m = 5; m >= 0; m--) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - m, 3), mk = mkey(d);
    students.forEach((s) => s.groups.forEach((gid) => {
      const g = groups.find((x) => x.id === gid), price = courses.find((c) => c.id === g.course).price;
      if (s.joined.slice(0, 7) > mk) return;
      let part = 1;
      if (m === 0) part = s.payer < .62 ? 1 : s.payer < .76 ? .5 : 0; else if (s.payer > .97 && m === 1) part = .5;

      const day = Math.min(28, 1 + Math.floor(rnd() * (m === 0 ? Math.max(1, TODAY.getDate()) : 15)));
      payments.push({ id: 'p' + (++pn), sid: s.id, gid, month: mk, amount: price * part, method: pick(['cash', 'cash', 'cash', 'card']), date: mk + '-' + pad(day) });
    }));
  }
  // mock exams run on the centre's mock website, imported here
  const mocks = [];

        return `<tr><td class="nm">${esc(S(sid).name)}</td>${cells}<td class="pc" style="color:${pc !== null && pc < 80 ? 'var(--brick-ink)' : 'inherit'}">${pc === null ? '—' : pc + '%'}</td></tr>`; }).join('')}</tbody></table></div></div>
    <p class="demo">${J.mv === 'att' ? `✓ ${t('present').toLowerCase()} · ◷ ${t('late').toLowerCase()} · ✕ ${t('absent').toLowerCase()}` : `✓ ${t('hwY').toLowerCase()} · ✕ ${t('hwN').toLowerCase()} · · ${t('absentSkip').toLowerCase()}`}</p>`;

  if (J.step === 'att') {
    return head + dateChips + `<div class="panel"><div class="bar" style="margin-bottom:6px"><h2 style="margin:0;flex:1">${t('lesson')} · ${dayName(J.d)}<small>${ids.length} ${t('studentsN')}</small></h2><button class="btn sm" id="allHere">${t('allHere')}</button></div>

      <div class="pick" data-s="${sid}" data-k="a"><button class="p ${a === 'p' ? 'on' : ''}" data-v="p">${t('present')}</button><button class="l ${a === 'l' ? 'on' : ''}" data-v="l">${t('late')}</button><button class="a ${a === 'a' ? 'on' : ''}" data-v="a">${t('absent')}</button></div></div>`; }).join('')}
    <div class="bar" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-step="hw">${t('next')} →</button><button class="btn p" id="saveJ">${t('save')}</button></div></div>`;

  ${came.map((sid) => { const s = S(sid), h = dr.h[sid];
    return `<div class="mark"><div class="who">${avatar(s.name)}<div><b>${esc(s.name)}</b><span class="muted">${t('homework')} ${stHw(sid)}% ${t('hwDone')}</span></div></div>
    <div class="pick" data-s="${sid}" data-k="h"><button class="y ${h === 'y' ? 'on' : ''}" data-v="y">✓ ${t('hwY')}</button><button class="n ${h === 'n' ? 'on' : ''}" data-v="n">✕ ${t('hwN')}</button></div></div>`; }).join('')}

  <div class="bar" style="justify-content:flex-end;margin-top:14px"><button class="btn p" id="saveJ">${t('save')}</button></div></div>`;
};

let MS = null;
V.mocks = () => {
  const ms = [...D.mocks].sort((a, b) => b.date.localeCompare(a.date)).filter((m) => m.rows.some((r) => mySid(r.sid)));
  if (!ms.length) return `<p class="empty">${t('noRes')}</p>`;
  if (!MS || !ms.find((m) => m.id === MS)) MS = ms[0].id;
  const m = D.mocks.find((x) => x.id === MS), rows = m.rows.filter((r) => mySid(r.sid));
  const prevOf = (sid) => D.mocks.filter((x) => x.type === m.type && x.date < m.date).sort((a, b) => b.date.localeCompare(a.date)).map((x) => x.rows.find((r) => r.sid === sid)).find(Boolean);
  const isI = m.type === 'IELTS';
  const sorted = [...rows].sort((a, b) => isI ? b.ov - a.ov : b.sc - a.sc);
  return `<div class="bar mhead"><div class="grow"><b style="font-size:20px;display:block;line-height:1.25">${t('mockLead')}</b><p class="sub">${t('mockSrc')}</p></div>${role === 'teacher' ? '' : `<button class="btn p" id="importM">${t('importM')}</button>`}</div>
  <div class="mocks">${ms.map((x) => { const rr = x.rows.filter((r) => mySid(r.sid)), a = x.type === 'IELTS' ? (rr.reduce((s, r) => s + r.ov, 0) / (rr.length || 1)).toFixed(1) : (rr.reduce((s, r) => s + r.sc, 0) / (rr.length || 1)).toFixed(0);
    return `<button class="mcard ${x.id === MS ? 'on' : ''}" data-ms="${x.id}"><span class="bar"><span class="tag ${x.type === 'IELTS' ? 't-bad' : 't-blue'}">${x.type}</span><span class="muted">${dayName(x.date)}</span></span><b class="big">${a}</b><span class="muted">${t('avg')} · ${rr.length} ${t('participants')}</span></button>`; }).join('')}</div>
  <div class="panel"><h2>${m.type} · ${dayName(m.date)}<small>${rows.length} ${t('participants')}</small></h2><div class="scroll"><table class="stack"><thead><tr><th>${t('name')}</th><th>${t('group')}</th>${isI ? '<th class="num">L</th><th class="num">R</th><th class="num">W</th><th class="num">S</th><th class="num">' + t('overall') + '</th>' : '<th class="num">' + t('score') + ' /75</th><th class="num">' + t('level') + '</th>'}<th class="num">${t('change')}</th></tr></thead><tbody>

    <td class="num" data-l="${t('change')}">${d === null ? '—' : d > 0 ? `<span class="up">↑ ${isI ? d.toFixed(1) : d}</span>` : d < 0 ? `<span class="down">↓ ${isI ? (-d).toFixed(1) : -d}</span>` : '0'}</td></tr>`; }).join('')}

  <button class="btn" data-openj="${g.id}">${t('openJ')}</button></div>`; }).join('')}</div>`;

let PF = 'all';

  const due = dues(MONTH), need = due.reduce((a, x) => a + x.need, 0), got = due.reduce((a, x) => a + Math.min(x.got, x.need), 0), pct = need ? Math.round(got / need * 100) : 0;

  </tbody></table></div></div><p class="demo">${t('demoNote')}</p>`;
};

const STAGES = ['new', 'call', 'trial', 'won', 'lost'];
V.leads = () => `<div class="bar"><p class="lead" style="flex:1;font-size:clamp(22px,2.6vw,30px)">${t('leadTitle', { n: D.leads.length, c: D.leads.filter((l) => l.stage === 'won').length })}</p><button class="btn p" id="addLead">+ ${t('addLead')}</button></div>

    <div class="bar">${st !== 'new' ? `<button class="btn sm" data-lm="${l.id}|-1" aria-label="${t('back')}">←</button>` : ''}${st !== 'won' && st !== 'lost' ? `<button class="btn sm" data-lm="${l.id}|1" style="flex:1">${t('move')} →</button>` : ''}${st === 'trial' ? `<button class="btn sm" data-lm="${l.id}|lost">${t('st_lost')}</button>` : ''}</div></div>`).join('')}</div>`; }).join('')}</div>`;

  <div class="panel">${times.length ? times.map((tm) => `<div class="slot"><span class="time">${tm}</span><div class="lessons">${gs.filter((g) => g.time === tm).map((g) => `<div class="les" style="border-left-color:${COLORS[D.groups.indexOf(g) % COLORS.length]}"><b>${esc(g.name)}</b><span class="muted">${esc(T(g.teacher).name)} · ${t('room')} ${g.room} · ${g.ids.length} ${t('studentsN')}</span></div>`).join('')}</div></div>`).join('') : `<p class="empty">${t('noLessons')}</p>`}</div>`;

V.teachers = () => `<div class="grid3">${D.teachers.map((x) => {

  return `<div class="panel" style="display:grid;gap:10px"><div class="who">${avatar(x.name)}<div><b>${esc(x.name)}</b><span class="muted">${esc(x.subject)}</span></div></div>
  <div class="list"><div class="row"><span class="grow">${t('groups')}</span><b>${gs.length}</b></div><div class="row"><span class="grow">${t('students')}</span><b>${ids.size}</b></div><div class="row"><span class="grow">${t('lessonsMonth')}</span><b>${lessons}</b></div>

V.reports = () => {
  const bars = (arr, suffix, max, colorFn) => arr.map((x) => `<div class="row" style="gap:10px"><span style="width:42%;flex:none">${esc(x.n)}</span><span class="grow" style="height:12px;background:var(--panel2);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${x.v / max * 100}%;background:${colorFn(x.v)}"></i></span><b class="num" style="width:52px">${x.v}${suffix}</b></div>`).join('');
  const tone = (v) => v >= 90 ? 'var(--ok)' : v >= 80 ? 'var(--warn)' : 'var(--brick)';

  const bySrc = Object.entries(src).map(([n, v]) => ({ n, v })).sort((a, b) => b.v - a.v);
  const im = D.mocks.filter((m) => m.type === 'IELTS').sort((a, b) => a.date.localeCompare(b.date)).map((m) => ({ n: dayName(m.date), v: +(m.rows.reduce((a, r) => a + r.ov, 0) / m.rows.length).toFixed(1) }));

  <div class="grid2"><div class="panel"><h2>${t('byCourse')}</h2><div class="list">${bars(byC, '', Math.max(...byC.map((x) => x.v)), () => 'var(--ink)')}</div></div>
  <div class="panel" style="display:grid;gap:18px"><div><h2>${t('mockTrend')}</h2><div class="list">${bars(im, '', 9, () => 'var(--blue)')}</div></div><div><h2>${t('bySource')}</h2><div class="list">${bars(bySrc, '', Math.max(...bySrc.map((x) => x.v)), () => 'var(--brick)')}</div></div></div></div>`;

let PS = null;
V.parent = () => {
  const mocked = new Set(D.mocks.flatMap((m) => m.rows.map((r) => r.sid)));
  if (!PS) PS = D.students.find((s) => mocked.has(s.id) && debtOf(s.id) > 0 && stAtt(s.id) < 90)?.id || D.students[0].id;
  const s = S(PS), g = G(s.groups[0]);
  const nd = new Date(TODAY); for (let k = 0; k < 8 && !lessonDay(g, nd); k++) nd.setDate(nd.getDate() + 1);
  const first = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1, 12), days = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate();

function saveJournal() {
  const dr = J.draft, a = {}, h = {};
  for (const k in dr.a) if (dr.a[k]) a[k] = dr.a[k];
  for (const k in dr.h) if (dr.h[k] && a[k] !== 'a') h[k] = dr.h[k];
  D.att[dr.key] = a; D.hw[dr.key] = h; persist();
  const g = G(J.g), abs = Object.keys(a).filter((k) => a[k] === 'a'), no = Object.keys(h).filter((k) => h[k] === 'n');

document.addEventListener('click', (e) => {
  const el = e.target.closest('button,a,tr[data-st]'); if (!el) return;
  const d = el.dataset;
  if ('close' in d) { closeAll(); if (el.tagName !== 'A') return; }
  if (d.role) { role = d.role; LS.set('gek-role', role); location.hash = ROLES[role][0]; render(); return; }
  if (d.lang) { L = d.lang; LS.set('gek-lang', L); const open = $('#modal').classList.contains('on'); render(); if (open) settingsModal(); return; }
  if (d.themeSet) { THEME = d.themeSet; LS.set('gek-theme', THEME); applyTheme(); settingsModal(); return; }
  if ('settings' in d) return settingsModal();
  if ('logout' in d) { closeAll(); role = ''; LS.set('gek-role', ''); history.replaceState(null, '', location.pathname); render(); return; }
  if ('reset' in d) { D = build(); persist(); J = { g: null, d: null, step: 'att', mv: 'att', draft: null }; MS = null; PS = null; closeAll(); render(); toast(t('saved')); return; }
  if ('more' in d) return moreSheet();
  if (d.g) { J.g = d.g; J.d = null; J.step = 'att'; }
  if (d.jg) { J.g = d.jg; J.d = null; render(); return; }
  if (d.jd) { J.d = d.jd; render(); return; }
  if (d.step) { J.step = d.step; render(); window.scrollTo(0, 0); return; }
  if (d.mv) { J.mv = d.mv; render(); return; }
  if (d.openj) { J.g = d.openj; J.d = null; J.step = 'att'; location.hash = 'journal'; return; }
  if (d.v && el.parentElement.dataset.s) { const p = el.parentElement, k = p.dataset.k, sid = p.dataset.s, o = J.draft[k]; o[sid] = o[sid] === d.v ? undefined : d.v; render(); return; }
  if (el.id === 'allHere') { G(J.g).ids.forEach((sid) => { if (!J.draft.a[sid]) J.draft.a[sid] = 'p'; }); render(); return; }
  if (el.id === 'allDone') { G(J.g).ids.forEach((sid) => { if (J.draft.a[sid] !== 'a' && !J.draft.h[sid]) J.draft.h[sid] = 'y'; }); render(); return; }
  if (el.id === 'saveJ') return saveJournal();
  if (d.sf) { SF = d.sf; render(); return; }
  if (d.pf) { PF = d.pf; render(); return; }
  if (d.ms) { MS = d.ms; render(); return; }
  if (d.st) return openStudent(d.st);
  if (d.pay) { closeAll(); const [sid, gid] = d.pay.split('|'); return payModal(sid, gid); }
  if (d.remind) return remindModal([d.remind.split('|')]);
  if (el.id === 'remindAll') return remindModal(dues(MONTH).filter((x) => x.left > 0).map((x) => [x.s.id, x.g.id]));
  if (el.id === 'addSt') return studentModal();
  if (el.id === 'addLead') return leadModal();
  if (el.id === 'importM') return importModal('file');
  if (d.imp) return importModal(d.imp);
  if ('sitedemo' in d) { toast(t('siteDemo')); return; }
  if ('paylater' in d) { toast(t('payLater')); return; }
  if (d.lm) { const [id, step] = d.lm.split('|'); const l = D.leads.find((x) => x.id === id); l.stage = step === 'lost' ? 'lost' : STAGES[Math.max(0, Math.min(3, STAGES.indexOf(l.stage) + +step))]; persist(); render(); return; }
  if (d.sd) { SD = +d.sd; render(); return; }
  if (d.res) { return openStudent(d.res); }
});
